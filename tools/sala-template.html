<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff}canvas{display:block}
</style></head><body><canvas id="c"></canvas><script>
const D=DATA_PLACEHOLDER;
const {clave,I,drawInTileSrc,marca,escH,SOLID_IN,SOLID_PATIO}=D;
const ESCH=new Set(escH||[]);
const g=I.grid, W=g[0].length, H=g.length;
const TS=28, ML=54, MT=52, MR=330, MB=54;
const cw=Math.max(ML+W*TS+MR, 920), ch=Math.max(MT+H*TS+MB, 420);
const c=document.getElementById('c'); c.width=cw; c.height=ch;
const x=c.getContext('2d');
x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);
const T=t=>ML+t*TS, V=t=>MT+t*TS;

// dibujar cada casilla con el pincel real del juego (16px, escalado)
const off=document.createElement('canvas'); off.width=16; off.height=16;
const octx=off.getContext('2d');
window.TILE=16; window.ctx=octx;
eval(drawInTileSrc);
x.imageSmoothingEnabled=false;
for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++){
  octx.clearRect(0,0,16,16);
  try{ drawInTile(g[ty][tx],0,0,!!I.isPatio, ESCH.has(tx+','+ty)); }catch(e){}
  x.imageSmoothingEnabled=false;
  x.drawImage(off,T(tx),V(ty),TS,TS);
}
// rejilla
x.lineWidth=1;
for(let tx=0;tx<=W;tx++){x.strokeStyle=(tx%5===0)?'rgba(0,0,0,.40)':'rgba(0,0,0,.14)';
  x.beginPath();x.moveTo(T(tx)+.5,MT);x.lineTo(T(tx)+.5,MT+H*TS);x.stroke();}
for(let ty=0;ty<=H;ty++){x.strokeStyle=(ty%5===0)?'rgba(0,0,0,.40)':'rgba(0,0,0,.14)';
  x.beginPath();x.moveTo(ML,V(ty)+.5);x.lineTo(ML+W*TS,V(ty)+.5);x.stroke();}
x.strokeStyle='#2a2a33';x.lineWidth=2;x.strokeRect(ML,MT,W*TS,H*TS);
// coordenadas en cada casilla
x.font='9px ui-monospace,monospace';x.fillStyle='#555';x.textAlign='center';
for(let tx=0;tx<W;tx++) x.fillText(tx, T(tx)+TS/2, MT-8);
x.textAlign='right';
for(let ty=0;ty<H;ty++) x.fillText(ty, ML-8, V(ty)+TS/2+3);
x.textAlign='left';x.font='bold 11px system-ui';x.fillStyle='#888';
x.fillText('x →',ML-46,MT-8); x.save();x.translate(16,MT+30);x.rotate(-Math.PI/2);x.fillText('y ↓',0,0);x.restore();
// la letra encima de cada casilla, tenue, para poder leer la rejilla
x.textAlign='center';x.font='bold 11px ui-monospace,monospace';
for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++){
  const ch2=g[ty][tx]; if(ch2==='#') continue;
  x.fillStyle='rgba(0,0,0,.34)'; x.fillText(ch2,T(tx)+TS/2,V(ty)+TS-4);
}
// recuadro de atencion
if(marca){
  const [a,b,cc,dd]=marca;
  x.save();x.setLineDash([7,4]);x.strokeStyle='#c0219b';x.lineWidth=3;
  x.strokeRect(T(a)-2,V(b)-2,(cc-a+1)*TS+4,(dd-b+1)*TS+4);x.restore();
  const lab=marca[4]||'';
  if(lab){ x.font='bold 12px system-ui'; const tw=x.measureText(lab).width;
    x.fillStyle='#c0219b'; x.fillRect(T(a)-2,V(b)-22,tw+14,18);
    x.fillStyle='#fff'; x.textAlign='left'; x.fillText(lab,T(a)+5,V(b)-9); }
}
// ---------------- panel ----------------
const LX=ML+W*TS+24; let ly=MT+4;
x.textAlign='left';
const tit=I.name||clave;
let ts=20; x.font='bold '+ts+'px system-ui';
while(x.measureText(tit).width>cw-LX-16 && ts>12){ ts--; x.font='bold '+ts+'px system-ui'; }
x.fillStyle='#1a1a22'; x.fillText(tit,LX,ly+16);
x.font='12px system-ui';x.fillStyle='#666';
x.fillText('clave "'+clave+'"  ·  '+W+' × '+H+' casillas',LX,ly+36);
ly+=58;
x.font='bold 12px system-ui';x.fillStyle='#c0219b';x.fillText('PIEZAS DE ESTA SALA',LX,ly);
x.strokeStyle='#e2d8c8';x.lineWidth=1;x.beginPath();x.moveTo(LX,ly+5.5);x.lineTo(LX+290,ly+5.5);x.stroke();
ly+=20;
const NOMBRE={'#':'pared','=':'pared clara','.':'suelo','+':'umbral','a':'suelo de aula',
 'r':'suelo de recepción','k':'suelo de oficina','b':'suelo de baño','l':'suelo de baño','g':'suelo',
 't':'mesa','e':'silla','m':'mesa con portátil','s':'estantería','D':'escritorio','c':'mostrador / barra',
 'u':'taburete','K':'barril','B':'estante de botellas','p':'planta','I':'tablón de anuncios','P':'pizarra',
 'Z':'pantalla de proyección','W':'inodoro','L':'lavabo','o':'árbol','F':'fuente',
 'X':'SALIDA (al vestíbulo)','E':'SALIDA (al campus)','Y':'puerta al patio','G':'puerta al bar',
 'S':'tramo de escalera','V':'ESCALERA que baja','U':'ESCALERA que sube (salida)',
 '1':'puerta a sala 1','2':'puerta a sala 2','3':'puerta a sala 3','4':'puerta a sala 4',
 '5':'puerta a sala 5','6':'puerta a sala 6','A':'puerta a sala A','C':'puerta a sala C','J':'puerta lateral'};
const destino={}; (I.doors||[]).forEach(d=>{ destino[g[d.y][d.x]]=d.to; });
const usados=[...new Set(g.join('').split(''))].sort();
usados.forEach(ch2=>{
  octx.clearRect(0,0,16,16);
  try{ drawInTile(ch2,0,0,!!I.isPatio, ESCH.size>0 && 'SVU'.includes(ch2)); }catch(e){}
  x.imageSmoothingEnabled=false; x.drawImage(off,LX,ly-13,17,17);
  x.strokeStyle='rgba(0,0,0,.25)';x.lineWidth=1;x.strokeRect(LX+.5,ly-12.5,16,16);
  x.font='bold 12px ui-monospace,monospace';x.fillStyle='#1a1a22';x.fillText(ch2,LX+24,ly);
  let txt=NOMBRE[ch2]||'??? sin dibujo asignado';
  if(destino[ch2]) txt+=' → '+destino[ch2];
  x.font='12px system-ui';x.fillStyle=NOMBRE[ch2]?'#3a3a44':'#c0219b';
  x.fillText(txt,LX+42,ly);
  ly+=19;
});
if(D.nota){ ly+=10;
  x.font='bold 12px system-ui';x.fillStyle='#c0219b';x.fillText('NOTA',LX,ly);
  x.strokeStyle='#e2d8c8';x.beginPath();x.moveTo(LX,ly+5.5);x.lineTo(LX+290,ly+5.5);x.stroke();ly+=20;
  x.font='12px system-ui';x.fillStyle='#3a3a44';
  D.nota.forEach(t=>{ x.fillText(t,LX,ly); ly+=17; });
}
</script></body></html>
