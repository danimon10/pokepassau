<style>
  :root{

  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#14161f;overflow:hidden;font-family:'Courier New',monospace;

  #game{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%, #2a2f4a, #14161f);}
  /* el "stage" envuelve al canvas: toda la UI del juego se ancla a el, no a la ventana */
  @media (orientation:portrait){ body.tmode #game{padding-top:min(15vh,120px);} }
  #stage{position:relative;flex:0 0 auto;touch-action:none;
    --ctl:132px; --abtn:66px; --pad:12px; --fs:16px; --ib:44px;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block;
    box-shadow:0 0 0 4px #20243a, 0 0 30px rgba(0,0,0,.6);touch-action:none;}

  #menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;color:#fff;text-align:center;padding:20px;overflow-y:auto;
    background:linear-gradient(160deg,#3a6ea5 0%, #2a4d7a 55%, #1e3a5f 100%);}
  #menu h1{font-size:clamp(26px,7vw,52px);letter-spacing:2px;line-height:1.05;
    text-shadow:3px 3px 0 #1a2a44, 5px 5px 0 rgba(0,0,0,.3);color:#ffe9a8;margin-bottom:4px;}
  #menu h1 .sub{display:block;font-size:.4em;color:#bfe0ff;letter-spacing:6px;margin-top:8px;text-shadow:2px 2px 0 #1a2a44;}
  .panel{background:var(--dlg-bg);color:var(--txt);border:4px solid var(--dlg-frame);
    border-radius:10px;box-shadow:0 6px 0 var(--dlg-shadow);padding:16px 18px;margin-top:18px;max-width:580px;width:100%;}

  .row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;}
  .pick{cursor:pointer;border:3px solid var(--dlg-frame);border-radius:8px;background:#fff;
    padding:9px;width:84px;transition:transform .08s;box-shadow:0 3px 0 rgba(90,107,138,.5);}

  .pick.sel{background:#ffe9a8;border-color:#e0a93a;box-shadow:0 3px 0 #c98a20;}

  .career{cursor:pointer;border:3px solid var(--dlg-frame);border-radius:8px;background:#fff;

<script>
//==================================================================
//  CAMPUS PASSAU — Uni·Quest  (motor con mapas múltiples + interiores)
//==================================================================
const TILE=16;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const stage=document.getElementById('stage');
let VW=240, VH=160;                       // resolucion interna del lienzo (en pixeles de juego)
function setViewSize(w,h){
  if(w===VW && h===VH) return false;
  VW=w; VH=h; cv.width=w; cv.height=h;
  ctx.imageSmoothingEnabled=false;        // cambiar width/height reinicia el contexto
  return true;
}

//------------------------------------------------------------------
//  DETECCION DE DISPOSITIVO  (movil/tablet tactil  vs  escritorio)
//------------------------------------------------------------------
function detectTouch(){
  const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
  const noHover = window.matchMedia && matchMedia('(hover:none)').matches;
  const hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
  return (coarse || noHover) && hasTouch;
}
let touchMode = detectTouch();
function applyMode(){
  document.body.classList.toggle('tmode', touchMode);
  resize();
}

//------------------------------------------------------------------
//  ESCALADO ADAPTATIVO DEL LIENZO
//  · escritorio: escala entera (pixel art perfecto)
//  · movil: pasos de 1/4 para aprovechar toda la pantalla
//------------------------------------------------------------------
function viewport(){
  const vv=window.visualViewport;
  return {w: Math.round(vv?vv.width:window.innerWidth), h: Math.round(vv?vv.height:window.innerHeight)};
}
function resize(){
  const {w:vw, h:vh} = viewport();

  // --- elegir la resolucion interna segun el dispositivo y la orientacion ---
  let iw=240, ih=160;
  if(touchMode){
    const ar = vw/vh;
    if(ar < 1){            // vertical: ampliamos la vista hacia arriba/abajo
      ih = Math.max(160, Math.min(224, Math.floor(240/ar/16)*16));
    }else{                 // horizontal: ampliamos la vista a los lados
      iw = Math.max(240, Math.min(352, Math.floor(160*ar/16)*16));
    }
  }
  // nunca mostrar mas superficie que el propio mapa: las salas pequenas
  // se amplian hasta llenar la pantalla en vez de flotar en un vacio de color
  try{   // (en el primer arranque el mapa aun no existe)
    if(mapW>0) iw=Math.max(128, Math.min(iw, mapW*TILE));
    if(mapH>0) ih=Math.max(96,  Math.min(ih, mapH*TILE));
  }catch(_){}
  setViewSize(iw,ih);

  const raw = Math.min(vw/VW, vh/VH);
  const step = (window.devicePixelRatio||1) >= 2 ? 8 : 4;  // pantallas nitidas -> pasos mas finos
  let s = touchMode ? Math.max(1, Math.floor(raw*step)/step)  // 1.000, 1.125, 1.250...
                    : Math.max(1, Math.floor(raw));           // 1, 2, 3...
  const w = Math.round(VW*s), h = Math.round(VH*s);
  cv.style.width = w+'px'; cv.style.height = h+'px';

  // tamano de los controles: relativo a la pantalla, no al lienzo
  const ctl  = Math.max(96, Math.min(150, Math.round(Math.min(vw,vh)*0.30)));
  const fs   = Math.max(11, Math.min(16, Math.round(w/26)));
  const ib   = Math.max(34, Math.min(46, Math.round(ctl*0.33)));
  stage.style.setProperty('--ctl',  ctl+'px');
  stage.style.setProperty('--abtn', Math.round(ctl*0.50)+'px');
  stage.style.setProperty('--pad',  Math.max(6, Math.round(ctl*0.09))+'px');
  stage.style.setProperty('--fs',   fs+'px');
  stage.style.setProperty('--ib',   ib+'px');
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.visualViewport){
  visualViewport.addEventListener('resize',resize);
  visualViewport.addEventListener('scroll',resize);
}
applyMode();

// cambio automatico de modo: si aparece un toque -> tactil; si se usa el teclado -> escritorio
window.addEventListener('touchstart',()=>{ if(!touchMode){touchMode=true;applyMode();} },{passive:true,capture:true});
window.addEventListener('keydown',e=>{
  if(e.key==='t'||e.key==='T') return;                       // la T alterna el modo a proposito
  if(touchMode && (e.key.length===1 || e.key.startsWith('Arrow') || e.key==='Enter')){ touchMode=false; applyMode(); }
},{capture:true});

function drawPerson(c,px,py,skin,hair,shirt,dir,frame){
  c.fillStyle='rgba(0,0,0,.18)'; c.fillRect(px+3,py+14,10,3);
  c.fillStyle='#3a3a4a';
  c.fillRect(px+5,py+12+(frame===1?0:1),2,3);
  c.fillRect(px+9,py+12+(frame===2?0:1),2,3);
  c.fillStyle=shirt; c.fillRect(px+4,py+8,8,5);
  c.fillRect(px+3,py+8,1,4); c.fillRect(px+12,py+8,1,4);
  c.fillStyle=skin; c.fillRect(px+5,py+3,6,6);
  c.fillStyle=hair;
  if(dir==='up'){ c.fillRect(px+5,py+2,6,5); }
  else { c.fillRect(px+5,py+2,6,3); c.fillRect(px+4,py+3,1,2); c.fillRect(px+11,py+3,1,2); }
  if(dir!=='up'){
    c.fillStyle='#2a2230';
    if(dir==='down'){ c.fillRect(px+6,py+6,1,1); c.fillRect(px+9,py+6,1,1); }
    if(dir==='left'){ c.fillRect(px+6,py+6,1,1); }
    if(dir==='right'){ c.fillRect(px+9,py+6,1,1); }
  }
}

let animTick=0;
function noise(x,y){let n=Math.sin(x*127.1+y*311.7)*43758.5; return n-Math.floor(n);}

//==================================================================
//  DIBUJO DE EDIFICIOS COMPLETOS (estilo Pokémon Ruby)
//  Se dibuja el edificio entero como una pieza: sombra, cuerpo de
//  fachada, tejado con alero y volumen, ventanas, puerta y cartel.
//==================================================================
function shade(hex,f){ // aclara(f>0)/oscurece(f<0) un color hex
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const m=(v)=>Math.max(0,Math.min(255, Math.round(v + 255*f)));
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);
}
function drawBuilding(b){
  // píxeles en pantalla (mundo - cámara)
  const x=b.x0*TILE-cam.x, y=b.y0*TILE-cam.y;
  const w=(b.x1-b.x0+1)*TILE, h=(b.y1-b.y0+1)*TILE;
  const roofH=Math.round(h*0.42);           // alto de la zona de tejado
  const wallY=y+roofH, wallH=h-roofH;
  // ---- sombra proyectada ----
  ctx.fillStyle='rgba(0,0,0,.16)';
  ctx.fillRect(x+4, y+h-2, w, 4);
  ctx.fillRect(x+w-2, y+roofH-2, 5, wallH);

  if(b.style==='historic'){ drawHistoric(b,x,y,w,h,roofH,wallY,wallH); return; }

  // ===== CUERPO / FACHADA =====
  const wallC = b.style==='station' ? '#e8dccb' : '#e4e9ef';
  ctx.fillStyle=wallC; ctx.fillRect(x, wallY, w, wallH);
  // zócalo
  ctx.fillStyle=shade(wallC,-0.12); ctx.fillRect(x, y+h-3, w, 3);
  // esquinas/pilares
  ctx.fillStyle=shade(wallC,-0.07); ctx.fillRect(x,wallY,2,wallH); ctx.fillRect(x+w-2,wallY,2,wallH);

  // ===== VENTANAS (cuadrícula) =====
  const winC='#bfe0f5', winFrame=shade(wallC,-0.18);
  const cols=Math.max(2, Math.floor((w-8)/12));
  const gap=(w-8)/cols;
  for(let r=0;r<Math.max(1,Math.floor(wallH/12));r++){
    for(let c=0;c<cols;c++){
      const wx=x+5+Math.round(c*gap), wy=wallY+5+r*12;
      if(wy+7>y+h-4) continue;
      ctx.fillStyle=winFrame; ctx.fillRect(wx-1,wy-1,9,8);
      ctx.fillStyle=winC; ctx.fillRect(wx,wy,7,6);
      ctx.fillStyle='#d8f0ff'; ctx.fillRect(wx,wy,3,3); // reflejo
    }
  }

  // ===== TEJADO con volumen y alero =====
  const roof=b.roof, roofLt=shade(roof,0.12), roofDk=shade(roof,-0.15);
  // alero que sobresale
  ctx.fillStyle=roofDk; ctx.fillRect(x-2, wallY-2, w+4, 3);
  // cara frontal del tejado (trapecio simulado con 2 bandas)
  ctx.fillStyle=roof; ctx.fillRect(x, y+3, w, roofH-3);
  ctx.fillStyle=roofLt; ctx.fillRect(x, y+3, w, Math.max(3,Math.round(roofH*0.4))); // luz arriba
  // cumbrera
  ctx.fillStyle=shade(roof,0.2); ctx.fillRect(x+2, y+2, w-4, 2);
  // textura de tejas (líneas verticales suaves)
  ctx.fillStyle=roofDk;
  for(let i=x+6;i<x+w-2;i+=8) ctx.fillRect(i, y+4, 1, roofH-5);

  if(b.style==='station'){ // reloj en la estación
    const cxp=x+Math.round(w/2), cyp=y+Math.round(roofH/2)+1;
    ctx.fillStyle='#f8f4e4'; ctx.fillRect(cxp-4,cyp-4,8,8);
    ctx.fillStyle='#2a2230'; ctx.fillRect(cxp-1,cyp-3,1,4); ctx.fillRect(cxp,cyp,3,1);
  }
  if(b.style==='mall'){ // marquesina de cristal
    ctx.fillStyle='rgba(190,225,245,.6)'; ctx.fillRect(x+3, wallY, w-6, 4);
  }

  drawDoorAndSign(b,x,y,w,h,wallY,wallH);
}

function drawHistoric(b,x,y,w,h,roofH,wallY,wallH){
  // Nikolakloster: muros de piedra clara, tejado rojizo a dos aguas, patio interior visible
  const stone='#ddcfb2';
  ctx.fillStyle=stone; ctx.fillRect(x,wallY,w,wallH);
  // sillería (bloques de piedra)
  ctx.fillStyle=shade(stone,-0.1);
  for(let ry=wallY+4;ry<y+h-2;ry+=6){ ctx.fillRect(x,ry,w,1); }
  for(let rx=x+8;rx<x+w;rx+=14){ ctx.fillRect(rx,wallY,1,wallH); }
  // patio interior (courtyard) — hueco con suelo y arcos
  if(b.courtyard){
    const [cx0,cy0,cx1,cy1]=b.courtyard;
    const px=cx0*TILE-cam.x, py=cy0*TILE-cam.y;
    const pw=(cx1-cx0+1)*TILE, ph=(cy1-cy0+1)*TILE;
    ctx.fillStyle='#cdbf95'; ctx.fillRect(px,py,pw,ph);              // suelo patio
    ctx.fillStyle=shade('#cdbf95',-0.08);
    for(let gx=px;gx<px+pw;gx+=8) ctx.fillRect(gx,py,1,ph);
    for(let gy=py;gy<py+ph;gy+=8) ctx.fillRect(px,gy,pw,1);
    // arcos del claustro alrededor del patio
    ctx.fillStyle=shade(stone,-0.18);
    for(let ax=px+2;ax<px+pw-3;ax+=8){ ctx.fillRect(ax,py-4,5,3); ctx.fillRect(ax,py+ph+1,5,3); }
    // un arbolito en el patio
    ctx.fillStyle='#2f5f2c'; ctx.fillRect(px+pw/2-3,py+ph/2-3,6,6);
    ctx.fillStyle='#3f7d3a'; ctx.fillRect(px+pw/2-2,py+ph/2-2,3,3);
  }
  // ventanas arqueadas
  ctx.fillStyle=shade(stone,-0.2);
  const cols=Math.floor((w-6)/14);
  for(let c=0;c<cols;c++){ const wx=x+6+c*14, wy=wallY+5;
    if(b.courtyard && wx> (b.courtyard[0]*TILE-cam.x)-8 && wx<(b.courtyard[2]*TILE-cam.x)+8) continue;
    ctx.fillStyle=shade(stone,-0.2); ctx.fillRect(wx-1,wy-1,7,9);
    ctx.fillStyle='#9bb8c8'; ctx.fillRect(wx,wy,5,7); ctx.fillRect(wx+1,wy-1,3,1);
  }
  // tejado rojizo a dos aguas (perímetro)
  const roof=b.roof,roofLt=shade(roof,0.12),roofDk=shade(roof,-0.18);
  ctx.fillStyle=roofDk; ctx.fillRect(x-2,wallY-2,w+4,3);
  ctx.fillStyle=roof; ctx.fillRect(x,y+3,w,roofH-3);
  ctx.fillStyle=roofLt; ctx.fillRect(x,y+3,w,Math.round(roofH*0.45));
  ctx.fillStyle=shade(roof,0.22); ctx.fillRect(x+2,y+2,w-4,2);
  ctx.fillStyle=roofDk; for(let i=x+6;i<x+w-2;i+=8) ctx.fillRect(i,y+4,1,roofH-5);
  // torreta central
  ctx.fillStyle=stone; ctx.fillRect(x+w/2-5,y-6,10,10);
  ctx.fillStyle=roof; ctx.fillRect(x+w/2-6,y-9,12,4);
  ctx.fillStyle=shade(roof,0.2); ctx.fillRect(x+w/2-1,y-13,2,5);
  drawDoorAndSign(b,x,y,w,h,wallY,wallH);
}

function drawDoorAndSign(b,x,y,w,h,wallY,wallH){
  // puerta: centrada en la columna de la puerta real (b.door[0]) y abajo del edificio
  const dxp=(b.door[0]*TILE-cam.x);
  const doorW=14, doorH=Math.min(18, wallH-2);
  const doorY=y+h-doorH-1, doorX=dxp+1;
  ctx.fillStyle='#5a3a1a'; ctx.fillRect(doorX-1,doorY-1,doorW+2,doorH+1); // marco
  ctx.fillStyle='#7a5230'; ctx.fillRect(doorX,doorY,doorW,doorH);
  // doble hoja
  ctx.fillStyle='#6a4626'; ctx.fillRect(doorX+doorW/2-0.5,doorY,1,doorH);
  ctx.fillStyle='#caa45a'; ctx.fillRect(doorX+3,doorY+doorH/2,1,2); ctx.fillRect(doorX+doorW-5,doorY+doorH/2,1,2); // pomos
  // felpudo
  ctx.fillStyle='#caa45a'; ctx.fillRect(doorX-1,y+h-1,doorW+2,2);
  // cartel con siglas: justo encima de la puerta (sobre el dintel)
  const sgW=Math.max(16,b.label.length*7+6), sgX=dxp+7-sgW/2, sgY=doorY-11;
  ctx.fillStyle='#2f3650'; ctx.fillRect(sgX,sgY,sgW,9);
  ctx.fillStyle='#1f2640'; ctx.fillRect(sgX,sgY+8,sgW,1);
  ctx.fillStyle='#ffe9a8'; ctx.font='7px "Courier New",monospace'; ctx.textBaseline='top'; ctx.textAlign='center';
  ctx.fillText(b.label, sgX+sgW/2, sgY+1);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function drawOutTile(t,sx,sy,tx,ty){
  switch(t){
    case '.': {
      ctx.fillStyle='#7cc36b'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#6fb85f'; const r=noise(tx,ty);
      if(r>0.6){ctx.fillRect(sx+3,sy+5,1,2);ctx.fillRect(sx+9,sy+9,1,2);}
      break;}
    case ',': { // innwiese
      ctx.fillStyle='#8ace74'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#76bd62'; const r=noise(tx,ty);
      ctx.fillRect(sx+2,sy+4,2,3); if(r>.5)ctx.fillRect(sx+10,sy+8,2,3);
      break;}
    case 'I': { // placa innwiese
      ctx.fillStyle='#8ace74'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#76bd62'; ctx.fillRect(sx+3,sy+3,2,3);ctx.fillRect(sx+9,sy+9,2,3);ctx.fillRect(sx+6,sy+11,2,3);
      break;}
    case 'W': { // agua
      ctx.fillStyle='#5aa9d6'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#7dc3e8'; const w=(animTick/30+tx*0.7+ty*0.3); const off=(Math.sin(w)*2)|0;
      ctx.fillRect(sx+2+off,sy+4,5,1); ctx.fillRect(sx+9-off,sy+10,4,1);
      break;}
    case 'o': { // orilla
      ctx.fillStyle='#e8dcc0'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#d8c8a0'; ctx.fillRect(sx,sy,TILE,3);
      ctx.fillStyle='#cdbf95'; ctx.fillRect(sx+4,sy+8,3,2);ctx.fillRect(sx+10,sy+11,2,2);
      break;}
    case 'R': { // carretera asfalto
      ctx.fillStyle='#8a8f9a'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#7a7f8a'; const r=noise(tx,ty); if(r>.7)ctx.fillRect(sx+(r*10|0),sy+6,2,2);
      break;}
    case '|': { // linea central carretera
      ctx.fillStyle='#8a8f9a'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#e8d860'; ctx.fillRect(sx+6,sy+2,4,6);
      break;}
    case 'P': { // sendero peatonal (adoquin claro)
      ctx.fillStyle='#e2cfa0'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#d2bb85'; ctx.fillRect(sx,sy+7,TILE,1); ctx.fillRect(sx+7,sy,1,TILE);
      break;}
    case 'B': case 'N': case 'H': { // huella de edificio: suelo base (el edificio se dibuja encima)
      ctx.fillStyle='#7cc36b'; ctx.fillRect(sx,sy,TILE,TILE);
      break;}
    case 'D': { // baldosa frente a la puerta (la hoja la dibuja el edificio)
      ctx.fillStyle='#e2cfa0'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#d2bb85'; ctx.fillRect(sx,sy+7,TILE,1);ctx.fillRect(sx+7,sy,1,TILE);
      break;}
    case 'T': { // arbol borde
      ctx.fillStyle='#5fa84f'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#7a5230'; ctx.fillRect(sx+7,sy+11,2,4);
      ctx.fillStyle='#2f5f2c'; ctx.fillRect(sx+3,sy+1,10,11);
      ctx.fillStyle='#3f7d3a'; ctx.fillRect(sx+4,sy+2,8,8);
      ctx.fillStyle='#5aa84f'; ctx.fillRect(sx+5,sy+3,3,3);
      break;}
    case 't': { // arbol suelto sobre hierba
      ctx.fillStyle='#7cc36b'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#7a5230'; ctx.fillRect(sx+7,sy+11,2,4);
      ctx.fillStyle='#2f5f2c'; ctx.fillRect(sx+3,sy+1,10,11);
      ctx.fillStyle='#3f7d3a'; ctx.fillRect(sx+4,sy+2,8,8);
      ctx.fillStyle='#5aa84f'; ctx.fillRect(sx+5,sy+3,3,3);
      break;}
    case 'f': { // flores
      ctx.fillStyle='#7cc36b'; ctx.fillRect(sx,sy,TILE,TILE);
      const cols=['#e85a7a','#e8d65a','#e89a5a','#d65ad6'];
      ctx.fillStyle=cols[(tx+ty)%4];
      ctx.fillRect(sx+4,sy+5,2,2);ctx.fillRect(sx+10,sy+8,2,2);ctx.fillRect(sx+7,sy+11,2,2);
      break;}
    case 'L': { // farola
      ctx.fillStyle='#8ace74'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#4a4a5a'; ctx.fillRect(sx+7,sy+4,2,10);
      ctx.fillStyle='#ffe9a8'; ctx.fillRect(sx+6,sy+2,4,3);
      break;}
    case 'b': { // banco
      ctx.fillStyle='#8ace74'; ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='#9b6b4a'; ctx.fillRect(sx+2,sy+7,12,3);ctx.fillRect(sx+3,sy+10,2,3);ctx.fillRect(sx+11,sy+10,2,3);
      ctx.fillStyle='#7a5230'; ctx.fillRect(sx+2,sy+5,12,2);
      break;}
    default: ctx.fillStyle='#7cc36b'; ctx.fillRect(sx,sy,TILE,TILE);
  }
}

function drawInTile(t,sx,sy,patio){
  const F=(c)=>{ctx.fillStyle=c;ctx.fillRect(sx,sy,TILE,TILE);};
  const R=(c,x,y,w,h)=>{ctx.fillStyle=c;ctx.fillRect(sx+x,sy+y,w,h);};
  if(patio){
    switch(t){
      case '#': F('#c9b89a'); R('#a89571',0,0,TILE,1);R('#a89571',0,8,TILE,1);
        R('#a89571',7,0,1,8);R('#a89571',3,8,1,8);return;
      case 'p': F('#cdbf95'); R('#bfae80',0,7,TILE,1);R('#bfae80',7,0,1,TILE);return; // empedrado
      case '.': F('#b0a078'); R('#a0906a',0,0,TILE,2); return; // galería del claustro (arcada)
      case 'o': { // árbol del patio (grande, tilo)
        F('#b0a078'); R('#7a5230',6,11,3,5);
        ctx.fillStyle='#2f5f2c';ctx.beginPath();ctx.arc(sx+8,sy+7,7,0,7);ctx.fill();
        ctx.fillStyle='#3f7d3a';ctx.beginPath();ctx.arc(sx+8,sy+6,5,0,7);ctx.fill();
        ctx.fillStyle='#5aa84f';ctx.beginPath();ctx.arc(sx+6,sy+5,2.2,0,7);ctx.fill();return; }
      case 'F': { // fuente
        F('#b0a078'); R('#8fb0c8',1,1,14,14); R('#6a95b5',2,2,12,12);
        R('#bfe0f5',4,4,8,8); R('#d8f0ff',5,5,3,3);
        R('#9aa8b0',7,6,2,4); return; }
      case 'G': { // puerta a bar (en esquina) — arco de madera
        F('#b0a078'); R('#5a3a1a',3,1,10,14); R('#7a5230',4,2,8,13);
        R('#caa45a',9,8,1,2); R('#3a2410',6,3,4,3); return; }
      case 'X': { // salida al edificio
        F('#cdbf95'); R('#5a3a1a',3,2,10,12); R('#7a5230',4,3,8,11);
        R('#e8d860',6,6,4,2); return; }
      default: F('#cdbf95'); return;
    }
  }
  // ----- INTERIORES CON PAREDES -----

//  ESTADO
//==================================================================
const SOLID_OUT=new Set(['T','t','W','o','B','N','L']);
// interiores con paredes: muebles y elementos sólidos
const SOLID_IN=new Set(['#','=','s','c','t','e','D','K','B','W','L','p','I','u','m','P','Z']);
// patio: sólidos = muros, árboles y fuente
const SOLID_PATIO=new Set(['#','o','F']);

//==================================================================
//  VALIDADOR DE MAPAS
//  Se ejecuta al cargar la pagina. Comprueba la geometria de cada
//  sala y el cableado de cada puerta, para que un fallo de diseno
//  salte aqui (consola + banner rojo) y no como una sala a la que
//  luego no se puede entrar. Se puede relanzar con validateMaps().
//==================================================================
const TILES_OUT  =new Set(['.',',','I','W','o','R','|','P','B','N','H','D','T','t','f','L','b']);
const TILES_IN   =new Set(['#','=','.','+','r','a','k','b','l','g','m','s','D','c','u','t','e',
                           'K','B','W','L','p','I','1','2','3','4','5','6','A','C','J','Y','G','P','Z','X','E']);
const TILES_PATIO=new Set(['#','p','.','o','F','G','X']);

function validateMaps(){
  const errs=[], warns=[];
  const E=m=>errs.push(m), Wn=m=>warns.push(m);

  // ---------------- MAPA EXTERIOR ----------------
  const ow=OUTDOOR[0].length;
  OUTDOOR.forEach((r,y)=>{ if(r.length!==ow) E('OUTDOOR fila '+y+': mide '+r.length+' casillas, se esperaban '+ow); });
  OUTDOOR.forEach((r,y)=>[...r].forEach((c,x)=>{
    if(!TILES_OUT.has(c)) Wn('OUTDOOR ('+x+','+y+"): caracter '"+c+"' sin dibujo asignado"); }));

  const puertaDe={};
  for(const k in BUILDINGS){
    const b=BUILDINGS[k], dx=b.door[0], dy=b.door[1];
    const t=(OUTDOOR[dy]||'')[dx];
    if(t===undefined)      E(k+': la puerta ('+dx+','+dy+') cae fuera del mapa');
    else if(t!=='D')       E(k+': la puerta ('+dx+','+dy+") esta sobre '"+t+"' y tiene que estar sobre 'D' — asi no se puede entrar");
    if(DOOR_AT[dx+','+dy]!==k) E(k+': DOOR_AT no apunta a este edificio en ('+dx+','+dy+')');
    if(puertaDe[dx+','+dy]) E(k+' y '+puertaDe[dx+','+dy]+' comparten la puerta ('+dx+','+dy+')');
    puertaDe[dx+','+dy]=k;
    if(b.interior && !INTERIORS[b.interior]) E(k+": el interior '"+b.interior+"' no existe");
    if(!b.interior && !b.info)               E(k+': no tiene ni interior ni texto info — al entrar no pasaria nada');
  }

  const ocupado={};
  BLD_GEO.forEach(b=>{
    const B=BUILDINGS[b.key];
    if(!B){ E("BLD_GEO '"+b.key+"' no existe en BUILDINGS"); return; }
    if(B.door[0]!==b.door[0]||B.door[1]!==b.door[1])
      E(b.key+': la puerta de BLD_GEO ('+b.door+') no coincide con la de BUILDINGS ('+B.door+')');
    if(b.x1<b.x0||b.y1<b.y0) E(b.key+': rectangulo invertido (x0,y0 debe ser la esquina superior izquierda)');
    if(b.x0<0||b.y0<0||b.x1>=ow||b.y1>=OUTDOOR.length) E(b.key+': el rectangulo se sale del mapa');
    if(!/^#[0-9a-fA-F]{6}$/.test(b.roof)) E(b.key+": color de tejado invalido '"+b.roof+"'");
    for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){
      const c=x+','+y;
      if(ocupado[c]) E(b.key+' se solapa con '+ocupado[c]+' en ('+x+','+y+')');
      ocupado[c]=b.key;
    }
  });
  for(const k in BUILDINGS) if(!BLD_GEO.some(b=>b.key===k)) Wn(k+': sin geometria en BLD_GEO, no se dibuja en el mapa');

  // ---------------- INTERIORES ----------------
  for(const key in INTERIORS){
    const I=INTERIORS[key], g=I.grid;
    const SOL=I.isPatio?SOLID_PATIO:SOLID_IN, OKT=I.isPatio?TILES_PATIO:TILES_IN;
    const at =(x,y)=>(g[y]||'')[x];
    const pisable=(x,y)=>{ const t=at(x,y); return t!==undefined && !SOL.has(t); };

    if(!Array.isArray(g)||!g.length){ E(key+': no tiene grid'); continue; }
    const w=g[0].length;
    g.forEach((r,y)=>{ if(r.length!==w) E(key+' fila '+y+': mide '+r.length+' casillas, se esperaban '+w); });
    g.forEach((r,y)=>[...r].forEach((c,x)=>{
      if(!OKT.has(c)) Wn(key+' ('+x+','+y+"): caracter '"+c+"' sin dibujo asignado"); }));

    if(!I.name) Wn(key+': sin nombre');
    if(!I.spawn) E(key+': falta spawn');
    else if(!pisable(I.spawn[0],I.spawn[1]))
      E(key+': el spawn ('+I.spawn+") cae sobre '"+at(I.spawn[0],I.spawn[1])+"' — el jugador apareceria atrapado");

    if(!g.some(r=>r.indexOf('X')>=0||r.indexOf('E')>=0))
      E(key+": no tiene salida — hace falta al menos una casilla 'X' (al vestibulo) o 'E' (al campus)");

    (I.doors||[]).forEach(d=>{
      if(!pisable(d.x,d.y))
        E(key+' -> '+d.to+': la puerta ('+d.x+','+d.y+") esta sobre '"+at(d.x,d.y)+"' y no se puede pisar");
      const T=INTERIORS[d.to];
      if(!T){ E(key+" -> '"+d.to+"': ese destino no existe"); return; }
      const SOL2=T.isPatio?SOLID_PATIO:SOLID_IN;
      const tt=(T.grid[d.at[1]]||'')[d.at[0]];
      if(tt===undefined)      E(key+' -> '+d.to+': la casilla de llegada ('+d.at+') cae fuera de la sala');
      else if(SOL2.has(tt))   E(key+' -> '+d.to+': la casilla de llegada ('+d.at+") cae sobre '"+tt+"' — el jugador quedaria atrapado");
      if(!(T.grid.some(r=>r.indexOf('X')>=0||r.indexOf('E')>=0)))
        E(key+' -> '+d.to+': esa sala no tiene salida, se entra y no se puede volver');
    });

    (I.npcs||[]).forEach(n=>{
      if(at(n.x,n.y)===undefined) E(key+': el NPC "'+n.name+'" en ('+n.x+','+n.y+') cae fuera de la sala');
      else if(!pisable(n.x,n.y)) Wn(key+': el NPC "'+n.name+'" en ('+n.x+','+n.y+") esta encima de '"+at(n.x,n.y)+"'");
    });
    (I.info||[]).forEach(n=>{
      if(at(n.x,n.y)===undefined) E(key+': el cartel "'+n.name+'" en ('+n.x+','+n.y+') cae fuera de la sala');
    });
  }

  // ---------------- INFORME ----------------
  const salas=Object.keys(INTERIORS).length;
  if(errs.length){
    console.error('%cVALIDADOR: '+errs.length+' error(es)','color:#fff;background:#c0392b;padding:2px 6px;font-weight:bold');
    errs.forEach(m=>console.error('  x '+m));
  }
  if(warns.length){
    console.warn('%cVALIDADOR: '+warns.length+' aviso(s)','color:#000;background:#e0a93a;padding:2px 6px;font-weight:bold');
    warns.forEach(m=>console.warn('  ! '+m));
  }
  if(!errs.length && !warns.length)
    console.log('%cVALIDADOR: todo correcto — '+salas+' salas y '+BLD_GEO.length+' edificios','color:#fff;background:#1a7a3a;padding:2px 6px;font-weight:bold');

  if(errs.length) mostrarBannerErrores(errs);
  return {errores:errs, avisos:warns};
}

function mostrarBannerErrores(errs){
  const pinta=()=>{
    if(!document.body || document.getElementById('validBanner')) return;
    const d=document.createElement('div');
    d.id='validBanner';
    d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9999;background:#c0392b;color:#fff;'+
      'font:12px/1.45 ui-monospace,Consolas,monospace;padding:10px 40px 10px 14px;max-height:45vh;overflow:auto;'+
      'box-shadow:0 2px 10px rgba(0,0,0,.4)';
    d.innerHTML='<b>VALIDADOR — '+errs.length+' error(es) en los mapas</b><br>'+
      errs.map(m=>'&bull; '+m.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>');
    const b=document.createElement('button');
    b.textContent='×';
    b.style.cssText='position:absolute;top:6px;right:10px;background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1';
    b.onclick=()=>d.remove();
    d.appendChild(b);
    document.body.appendChild(d);
  };
  if(document.body) pinta(); else document.addEventListener('DOMContentLoaded',pinta);
}

try{ validateMaps(); }catch(e){ console.error('VALIDADOR: fallo interno',e); }

let scene='outdoor';        // 'outdoor' | interior key
let map=OUTDOOR, mapW=OUTDOOR[0].length, mapH=OUTDOOR.length;
let npcs=OUT_NPCS;
let patioMode=false;
let state='menu';           // menu | play | dialog | transition

let player={ x:39,y:31, px:39*TILE,py:31*TILE, dir:'up', moving:false, frame:0,
             char:CHARS[0], career:null, tx:39, ty:31 };
let returnPos=null;         // posición de regreso al salir de interior
let cam={x:0,y:0};

function tileAt(x,y){
  if(scene==='outdoor'){ if(x<0||y<0||x>=mapW||y>=mapH)return 'T'; return map[y][x]; }
  if(x<0||y<0||x>=mapW||y>=mapH)return '#'; return map[y][x];
}
function isSolid(x,y){
  const t=tileAt(x,y);
  if(scene==='outdoor') return SOLID_OUT.has(t);
  if(patioMode){ return SOLID_PATIO.has(t); }
  return SOLID_IN.has(t);
}

const keys={};
window.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  // overlay abierto: Esc cierra; no procesar movimiento/interacción
  if(state==='overlay'){
    if(e.key==='Escape') closeOverlay();
    return;
  }
  keys[e.key.toLowerCase()]=true;
  if((e.key==='i'||e.key==='I')&&state==='play'&&!e.repeat){ openInventory(); return; }
  if(e.key===' '||e.key==='Enter'||e.key==='z'||e.key==='Z'){
    if(state==='dialog') advanceDialog();
    else if(state==='play'&&!e.repeat) interact();
  }
});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
//------------------------------------------------------------------
//  D-PAD POR ZONA: toda el area responde y se puede deslizar el dedo
//  de una direccion a otra sin levantarlo.
//------------------------------------------------------------------
const dpadEl=document.getElementById('dpad'), aBtnEl=document.getElementById('aBtn');
const DIRS={arrowup:'du',arrowdown:'dd',arrowleft:'dl',arrowright:'dr'};
const dirEl={}; for(const k in DIRS) dirEl[k]=document.getElementById(DIRS[k]);
let dpadPtr=null, curDir=null, lastAPress=0;

function setDir(d){
  if(d===curDir) return;
  if(curDir){ keys[curDir]=false; dirEl[curDir].classList.remove('on'); }
  curDir=d;
  if(curDir){ keys[curDir]=true; dirEl[curDir].classList.add('on'); }
}
function dirFromPoint(x,y){
  const r=dpadEl.getBoundingClientRect();
  const dx=x-(r.left+r.width/2), dy=y-(r.top+r.height/2);
  if(Math.hypot(dx,dy) < r.width*0.13) return null;        // zona muerta central
  return Math.abs(dx)>Math.abs(dy) ? (dx>0?'arrowright':'arrowleft')
                                   : (dy>0?'arrowdown':'arrowup');
}
dpadEl.addEventListener('pointerdown',e=>{
  e.preventDefault(); dpadPtr=e.pointerId;
  try{ dpadEl.setPointerCapture(e.pointerId); }catch(_){}
  dpadEl.classList.add('act'); setDir(dirFromPoint(e.clientX,e.clientY));
});
dpadEl.addEventListener('pointermove',e=>{
  if(e.pointerId!==dpadPtr) return; e.preventDefault();
  setDir(dirFromPoint(e.clientX,e.clientY));
});
function dpadRelease(e){
  if(e && e.pointerId!==dpadPtr) return;
  dpadPtr=null; dpadEl.classList.remove('act'); setDir(null);
}
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>dpadEl.addEventListener(ev,dpadRelease));
window.addEventListener('blur',()=>dpadRelease(null));

// --- boton A ---
aBtnEl.addEventListener('pointerdown',e=>{
  e.preventDefault(); aBtnEl.classList.add('on'); lastAPress=Date.now();
  if(state==='dialog') advanceDialog(); else if(state==='play') interact();
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  aBtnEl.addEventListener(ev,()=>aBtnEl.classList.remove('on')));

// --- en movil, tocar la pantalla avanza el dialogo ---
stage.addEventListener('pointerdown',e=>{
  if(!touchMode || e.pointerType==='mouse') return;
  if(state!=='dialog') return;
  if(document.getElementById('dlgChoices').style.display==='flex') return;  // hay opciones que elegir
  if(e.target.closest && e.target.closest('#dlgChoices')) return;
  if(Date.now()-lastAPress<250) return;

//==================================================================
//  MOVIMIENTO
//==================================================================
function tryMove(){
  if(player.moving) return;
  let dx=0,dy=0;
  if(keys['arrowup']||keys['w']){dy=-1;player.dir='up';}
  else if(keys['arrowdown']||keys['s']){dy=1;player.dir='down';}
  else if(keys['arrowleft']||keys['a']){dx=-1;player.dir='left';}
  else if(keys['arrowright']||keys['d']){dx=1;player.dir='right';}
  if(dx===0&&dy===0) return;
  const nx=player.x+dx, ny=player.y+dy;
  if(npcs.some(n=>n.x===nx&&n.y===ny)) return;
  if(isSolid(nx,ny)){player.frame=0;return;}
  player.tx=nx;player.ty=ny;player.moving=true;
}
function updateMove(){
  if(!player.moving)return;
  const tgx=player.tx*TILE,tgy=player.ty*TILE,sp=2;
  if(player.px<tgx)player.px=Math.min(player.px+sp,tgx);
  if(player.px>tgx)player.px=Math.max(player.px-sp,tgx);
  if(player.py<tgy)player.py=Math.min(player.py+sp,tgy);
  if(player.py>tgy)player.py=Math.max(player.py-sp,tgy);
  player.frame=(Math.floor((player.px+player.py)/4)%2)+1;
  if(player.px===tgx&&player.py===tgy){
    player.x=player.tx;player.y=player.ty;player.moving=false;player.frame=0;
    onStep();
  }
}
function onStep(){
  const t=tileAt(player.x,player.y);
  if(scene==='outdoor'){
    const key=DOOR_AT[player.x+','+player.y];
    if(t==='D'&&key){ const b=BUILDINGS[key];
      if(b.interior){ enterInterior(b.interior); }
      else { bumpBack(); openDialog(b.name, b.info, b.choice||null); }
    }
  } else {
    // ¿puerta interna hacia otra escena?
    const I=INTERIORS[scene];
    if(I.doors){
      const d=I.doors.find(d=>d.x===player.x&&d.y===player.y);
      if(d){ gotoScene(d.to, d.at); return; }
    }
    if(t==='X'||t==='E'){ exitInterior(); }
  }
}
function bumpBack(){
  const back={up:[0,1],down:[0,-1],left:[1,0],right:[-1,0]}[player.dir];
  const bx=player.x+back[0], by=player.y+back[1];
  if(!isSolid(bx,by)){ player.x=bx;player.y=by;player.px=bx*TILE;player.py=by*TILE;player.tx=bx;player.ty=by; }
}

//==================================================================
//  CAMBIO DE ESCENA (con pila de retorno)
//==================================================================
let sceneStack=[]; // [{scene, x, y}] para volver atrás correctamente
function loadScene(key,at,dir){
  // BUGFIX: 'outdoor' no esta en INTERIORS -> "Continuar partida" fallaba al
  // cargar una posicion del mapa exterior.
  if(key==='outdoor'){
    scene='outdoor'; map=OUTDOOR; mapW=OUTDOOR[0].length; mapH=OUTDOOR.length;
    npcs=OUT_NPCS; patioMode=false;
    player.x=at?at[0]:39; player.y=at?at[1]:31;
    player.px=player.x*TILE; player.py=player.y*TILE;
    player.tx=player.x; player.ty=player.y; player.dir=dir||'up'; player.moving=false;
    resize(); updateLocation();
    if(typeof saveGame==='function' && state!=='menu' && player.career) saveGame();
    return;
  }
  scene=key; const I=INTERIORS[key];
  map=I.grid; mapW=map[0].length; mapH=map.length;
  npcs=I.npcs; patioMode=!!I.isPatio;
  player.x=at[0];player.y=at[1];player.px=player.x*TILE;player.py=player.y*TILE;
  player.tx=player.x;player.ty=player.y;player.dir=dir||'up';player.moving=false;
  showToast(I.name);
  resize();                      // ajustar la vista al tamano de esta sala
  if(typeof saveGame==='function' && state!=='menu' && player.career) saveGame();
}
function enterInterior(key){
  transition(()=>{
    sceneStack=[{scene:'outdoor', x:player.x, y:player.y}];
    loadScene(key, INTERIORS[key].spawn, 'up');
  });
}
// ir de una escena interior a otra (recordando de dónde venimos)
function gotoScene(key,at){
  transition(()=>{
    sceneStack.push({scene:scene, x:player.x, y:player.y});
    loadScene(key, at, 'down');
  });
}
function exitInterior(){
  transition(()=>{
    const prev=sceneStack.pop();
    if(!prev || prev.scene==='outdoor'){
      // volver al mundo exterior, bajo la puerta del edificio
      const back=prev||sceneStack[0];
      scene='outdoor'; map=OUTDOOR; mapW=OUTDOOR[0].length; mapH=OUTDOOR.length;
      npcs=OUT_NPCS; patioMode=false;
      const rx=(back?back.x:player.x), ry=(back?back.y:player.y);
      player.x=rx; player.y=ry+1;
      if(isSolid(player.x,player.y)) player.y=ry;
      player.px=player.x*TILE;player.py=player.y*TILE;player.tx=player.x;player.ty=player.y;
      player.dir='down';player.moving=false;
      resize();                  // volver a la vista amplia del exterior
      updateLocation();
    } else {
      // volver a la escena interior anterior (p.ej. del bar al patio)
      loadScene(prev.scene, [prev.x, prev.y], 'down');
    }
  });
}

//==================================================================
//  INTERACCIÓN
//==================================================================
function facing(){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[player.dir];return{x:player.x+d[0],y:player.y+d[1]};}
function opposite(d){return{up:'down',down:'up',left:'right',right:'left'}[d];}
function interact(){
  const f=facing();
  // ¿objeto recolectable enfrente o bajo el jugador?
  const objId=worldItemAt(f.x,f.y) || worldItemAt(player.x,player.y);
  if(objId){ promptPickup(objId); return; }
  const npc=npcs.find(n=>n.x===f.x&&n.y===f.y);
  if(npc){ npc.dir=opposite(player.dir); startNPC(npc); return; }
  // puerta enfrente (exterior) para edificios sin interior -> abrir info
  if(scene==='outdoor'){
    const key=DOOR_AT[f.x+','+f.y];
    if(key){ const b=BUILDINGS[key];
      if(b.interior) enterInterior(b.interior);
      else openDialog(b.name, b.info, b.choice||null);
      return;
    }
  } else {
    const I=INTERIORS[scene];
    // puerta interna hacia otra escena
    if(I.doors){ const d=I.doors.find(d=>d.x===f.x&&d.y===f.y); if(d){ gotoScene(d.to,d.at); return; } }
    // salida
    if(tileAt(f.x,f.y)==='X'||tileAt(f.x,f.y)==='E'){ exitInterior(); return; }
    // tablón de información
    if(I.info){ const inf=I.info.find(s=>s.x===f.x&&s.y===f.y); if(inf){ openDialog(inf.name||"Información", inf.lines); return; } }
  }
}
function startNPC(npc){
  let lines=[...npc.lines];
  if(npc.careerLine){ const cl=npc.careerLine[player.career]||npc.careerLine.default; if(cl)lines.push(cl); }
  openDialog(npc.name, lines, npc.choice||null);
}

const dlgBox=document.getElementById('dialog'),dlgName=document.getElementById('dlgName'),
      dlgText=document.getElementById('dlgText'),dlgArrow=document.getElementById('dlgArrow'),
      dlgChoices=document.getElementById('dlgChoices');
let dlg={lines:[],idx:0,choice:null}, typer=null,typing=false,fullLine='';
function openDialog(name,lines,choice){
  state='dialog'; dlg={lines:lines.slice(),idx:0,choice:choice};
  dlgName.textContent=name; dlgBox.style.display='block';
  dlgChoices.style.display='none';dlgChoices.innerHTML='';
  typeLine(lines[0]);
}
function typeLine(txt){
  fullLine=txt;typing=true;dlgText.textContent='';dlgArrow.style.display='none';
  let i=0;clearInterval(typer);
  typer=setInterval(()=>{dlgText.textContent=txt.slice(0,++i);
    if(i>=txt.length){clearInterval(typer);typing=false;dlgArrow.style.display='block';}},22);
}
function advanceDialog(){
  if(typing){clearInterval(typer);dlgText.textContent=fullLine;typing=false;dlgArrow.style.display='block';return;}
  dlg.idx++;
  if(dlg.idx<dlg.lines.length){typeLine(dlg.lines[dlg.idx]);return;}
  if(dlg.choice){ showChoices(dlg.choice); dlg.choice=null; return; }
  closeDialog();
}
function showChoices(choice){
  dlgArrow.style.display='none';
  dlgChoices.style.display='flex';dlgChoices.innerHTML='';
  choice.opts.forEach(o=>{
    const b=document.createElement('button');b.className='choice';b.textContent='▸ '+o.t;
    b.onclick=()=>{dlgChoices.style.display='none';dlg.lines=o.r.slice();dlg.idx=0;typeLine(o.r[0]);};
    dlgChoices.appendChild(b);
  });
}
function closeDialog(){dlgBox.style.display='none';state='play';}

const locBadge=document.getElementById('locBadge');let toastTimer=null,toastActive=false;
function showToast(txt){locBadge.textContent=txt;locBadge.style.background='#ffe9a8';toastActive=true;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toastActive=false;locBadge.style.background='var(--dlg-bg)';updateLocation();},2200);}
function updateLocation(){
  if(toastActive)return;
  if(scene!=='outdoor'){locBadge.textContent=INTERIORS[scene].name;return;}
  const x=player.x,y=player.y;let loc="Campus Uni Passau";
  if(y<=6)loc="Donau"; else if(y>=33)loc="Inn";
  else if(x>=33&&x<=49&&y>=29&&y<=32)loc="Innwiese";
  else if(y<=15&&x<25)loc="Bosque del campus";
  if(!toastActive)locBadge.textContent=loc;
}

//==================================================================
//  RENDER
//==================================================================
function updateCamera(){
  cam.x=player.px+8-VW/2; cam.y=player.py+8-VH/2;
  cam.x=Math.max(0,Math.min(cam.x,mapW*TILE-VW));
  cam.y=Math.max(0,Math.min(cam.y,mapH*TILE-VH));
  if(mapW*TILE<VW) cam.x=(mapW*TILE-VW)/2;
  if(mapH*TILE<VH) cam.y=(mapH*TILE-VH)/2;
}
function render(){
  ctx.fillStyle = scene==='outdoor'?'#5fa84f':'#8a7a9a';
  ctx.fillRect(0,0,VW,VH);
  const startX=Math.floor(cam.x/TILE),startY=Math.floor(cam.y/TILE);
  const offX=((cam.x%TILE)+TILE)%TILE, offY=((cam.y%TILE)+TILE)%TILE;
  const TX=Math.ceil(VW/TILE), TY=Math.ceil(VH/TILE);
  for(let ty=-1;ty<=TY;ty++)for(let tx=-1;tx<=TX;tx++){
    const mx=startX+tx,my=startY+ty;
    const t=tileAt(mx,my);
    const sx=tx*TILE-offX, sy=ty*TILE-offY;
    if(scene==='outdoor') drawOutTile(t,sx,sy,mx,my);
    else drawInTile(t,sx,sy,patioMode);
  }
  // entidades ordenadas por Y (edificios, NPCs y jugador comparten orden de profundidad)
  const ents=[];
  if(scene==='outdoor'){
    BLD_GEO.forEach(b=>{
      // visible solo si está cerca de cámara (optimización ligera)
      const bx=b.x0*TILE-cam.x, bw=(b.x1-b.x0+1)*TILE;
      const by=b.y0*TILE-cam.y, bh=(b.y1-b.y0+1)*TILE;
      if(bx+bw< -32||bx>VW+32||by+bh< -48||by>VH+48) return;
      ents.push({y:b.y1, draw:()=>drawBuilding(b)});
    });
  }
  npcs.forEach(n=>ents.push({y:n.y,draw:()=>drawPerson(ctx,n.x*TILE-cam.x,n.y*TILE-cam.y,'#f1c8a0','#3a2a1a',n.color,n.dir,0)}));
  worldItemsInScene().forEach(o=>ents.push({y:o.y-0.1,draw:()=>drawWorldItemAt(ctx,o.x,o.y,o.id)}));
  ents.push({y:player.y+0.5,draw:()=>drawPerson(ctx,player.px-cam.x,player.py-cam.y,player.char.skin,player.char.hair,player.char.shirt,player.dir,player.frame)});
  ents.sort((a,b)=>a.y-b.y).forEach(e=>e.draw());
  // indicador '!' frente a NPC o puerta interactuable
  if(state==='play'){
    const f=facing();
    const npc=npcs.find(n=>n.x===f.x&&n.y===f.y);
    let inter=!!npc;
    if(worldItemAt(f.x,f.y))inter=true;
    if(scene==='outdoor'&&DOOR_AT[f.x+','+f.y])inter=true;
    if(scene!=='outdoor'){
      const t=tileAt(f.x,f.y);
      if('XEYG123456ABCJ'.includes(t))inter=true;
      const I=INTERIORS[scene];
      if(I.doors&&I.doors.some(d=>d.x===f.x&&d.y===f.y))inter=true;
      if(I.info&&I.info.some(s=>s.x===f.x&&s.y===f.y))inter=true;
    }
    if(inter){
      const ex=f.x*TILE-cam.x, ey=f.y*TILE-cam.y;
      ctx.fillStyle='#fff';ctx.fillRect(ex+5,ey-7,6,7);
      ctx.fillStyle='#e0a93a';ctx.fillRect(ex+7,ey-6,2,3);ctx.fillRect(ex+7,ey-2,2,1);
    }
  }
}

let prevState='play';

// icono pixelado de objeto (para inventario)
function itemIconCanvas(type,size){
  const c=document.createElement('canvas'); c.width=size;c.height=size;
  const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  const s=size/16;
  x.scale(s,s);
  drawItemIcon(x,type);
  return c;
}
function drawItemIcon(x,type){
  // dibuja en 16x16
  if(type==='laptop'){ x.fillStyle='#3a4250';x.fillRect(2,4,12,7); x.fillStyle='#6aa8d8';x.fillRect(3,5,10,5);
    x.fillStyle='#2a3038';x.fillRect(1,11,14,2); x.fillStyle='#4a5468';x.fillRect(6,11,4,1); return; }
  if(type==='ring'){ x.fillStyle='#e8c85a';x.beginPath();x.arc(8,10,4,0,7);x.stroke();
    x.lineWidth=2;x.strokeStyle='#e8c85a';x.beginPath();x.arc(8,10,3,0,7);x.stroke();
    x.fillStyle='#8fd0f5';x.fillRect(7,3,2,2); x.fillStyle='#bfe8ff';x.fillRect(7,2,2,1); return; }
  if(type==='doc'||type==='cert'){ x.fillStyle='#f4efe0';x.fillRect(3,2,10,12); x.fillStyle='#c8a85a';x.fillRect(3,2,10,2);
    x.fillStyle='#8a90a8';x.fillRect(5,6,6,1);x.fillRect(5,8,6,1);x.fillRect(5,10,4,1);
    x.fillStyle='#d66a5a';x.fillRect(9,10,3,3); return; }
  if(type==='notebook'){ x.fillStyle='#5a8ad6';x.fillRect(3,2,10,12); x.fillStyle='#4a7ac0';x.fillRect(3,2,2,12);
    x.fillStyle='#f4efe0';x.fillRect(6,4,6,7); x.fillStyle='#b0b8c8';x.fillRect(7,6,4,1);x.fillRect(7,8,4,1); return; }
  // genérico
  x.fillStyle='#c8b89a';x.fillRect(3,3,10,10);
}


//==================================================================
//  LÓGICA DEL INVENTARIO Y APLICACIONES
//==================================================================
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString()+' '+d.toLocaleTimeString().slice(0,5); }

// --- INVENTARIO principal ---
function openInventory(){
  let slots='';
  if(gameData.inventory.length===0){
    slots='<div class="invempty">Tu mochila está vacía.<br>Explora el campus y recoge objetos con la barra espaciadora.</div>';
  } else {
    gameData.inventory.forEach(id=>{
      const it=ITEMS[id];
      slots+=`<div class="invslot" data-id="${id}"><canvas width="32" height="32"></canvas><div class="lbl">${esc(it.name)}</div></div>`;
    });
  }
  showOverlay(`<button class="close">✕</button><h3>🎒 Inventario</h3><div class="invgrid">${slots}</div>
    <div class="hintline">Toca un objeto para usarlo · Esc para cerrar</div>`);
  // pintar iconos
  overlay.querySelectorAll('.invslot').forEach(sl=>{
    const id=sl.dataset.id; const cv=sl.querySelector('canvas');
    const cx=cv.getContext('2d'); cx.imageSmoothingEnabled=false; cx.save(); cx.scale(2,2);
    drawItemIcon(cx, ITEMS[id].type); cx.restore();
    sl.onclick=()=>openItem(id);
  });
  overlay.querySelector('.close').onclick=closeOverlay;
}

// --- Interactuar con un objeto del inventario ---
function openItem(id){
  const it=ITEMS[id];
  let actions='';
  if(it.type==='laptop') actions=`<button class="ui primary" data-a="use">💻 Usar portátil</button>`;
  else if(it.type==='notebook') actions=`<button class="ui primary" data-a="use">📓 Abrir cuaderno</button>`;
  else if(it.readable) actions=`<button class="ui primary" data-a="read">🔍 Leer</button>`;
  showOverlay(`<button class="close">✕</button><h3>${esc(it.name)}</h3>
    <p style="font-size:14px;line-height:1.5">${esc(it.desc)}</p>
    <div class="btnrow">${actions}
      <button class="ui" data-a="give">🤝 Entregar</button>
      <button class="ui danger" data-a="drop">🗑️ Dejar aquí</button>
      <button class="ui" data-a="back">← Volver</button>
    </div>`);
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelectorAll('button[data-a]').forEach(b=>{
    b.onclick=()=>{
      const a=b.dataset.a;
      if(a==='back') return openInventory();
      if(a==='use'&&it.type==='laptop') return openLaptop();
      if(a==='use'&&it.type==='notebook') return openNotebook();
      if(a==='read') return showRead(it);
      if(a==='give') return giveItem(id);
      if(a==='drop') return dropItem(id);
    };
  });
}
function showRead(it){
  showOverlay(`<button class="close">✕</button><h3>${esc(it.name)}</h3>
    <div class="listitem">${it.readable.map(l=>esc(l)).join('<br>')}</div>
    <div class="btnrow"><button class="ui" data-a="back">← Volver</button></div>`);
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelector('button[data-a]').onclick=()=>openInventory();
}
function giveItem(id){
  showOverlay(`<button class="close">✕</button><h3>Entregar ${esc(ITEMS[id].name)}</h3>
    <p style="font-size:14px">No hay nadie cerca a quien entregárselo ahora mismo. Acércate a la persona indicada y vuelve a intentarlo.</p>
    <div class="btnrow"><button class="ui" data-a="back">← Volver</button></div>`);
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelector('button[data-a]').onclick=()=>openInventory();
  // (La entrega a NPCs concretos se puede ampliar luego; por ahora informa.)
}
function dropItem(id){
  // quitar del inventario y dejar tirado en la posición actual
  gameData.inventory = gameData.inventory.filter(x=>x!==id);
  gameData.worldItems[id]='dropped';
  gameData.droppedItems.push({id, scene:scene, x:player.x, y:player.y});
  saveGame();
  closeOverlay();
  showToast(`Dejaste: ${ITEMS[id].name}`);
}
function takeItem(id){
  if(!gameData.inventory.includes(id)) gameData.inventory.push(id);
  gameData.worldItems[id]='taken';
  gameData.droppedItems = gameData.droppedItems.filter(d=>d.id!==id);
  saveGame();
  showToast(`Obtienes: ${ITEMS[id].name}`);
}

// --- LAPTOP: menú de apps ---
function openLaptop(){
  showOverlay(`<button class="close">✕</button><h3>💻 Portátil</h3>
    <div class="applist">
      <div class="app" data-app="mail"><span class="ic">✉️</span>Correo</div>
      <div class="app" data-app="write"><span class="ic">📝</span>Documentos</div>
      <div class="app" data-app="sent"><span class="ic">📤</span>Enviados</div>
    </div>
    <div class="btnrow"><button class="ui" data-a="back">← Volver</button></div>`,'laptop');
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelector('button[data-a]').onclick=()=>openInventory();
  overlay.querySelectorAll('.app').forEach(a=>{
    a.onclick=()=>{ const ap=a.dataset.app;
      if(ap==='mail') composeEmail();
      else if(ap==='write') docList();
      else if(ap==='sent') sentBox();
    };

}
function composeEmail(){
  showOverlay(`<button class="close">✕</button><h3>✉️ Nuevo correo</h3>
    <label style="font-size:12px;color:#bfe0ff">Para:</label>
    <input class="ui" id="mTo" placeholder="destinatario@uni-passau.de">
    <label style="font-size:12px;color:#bfe0ff">Asunto:</label>
    <input class="ui" id="mSub" placeholder="Asunto">
    <label style="font-size:12px;color:#bfe0ff">Mensaje:</label>
    <textarea class="ui" id="mBody" placeholder="Escribe tu mensaje..."></textarea>
    <div class="btnrow">
      <button class="ui primary" data-a="send">📤 Enviar</button>
      <button class="ui" data-a="back">← Volver</button>
    </div>`,'laptop');
  overlay.querySelector('.close').onclick=closeOverlay;
  const q=s=>overlay.querySelector(s);
  q('button[data-a="back"]').onclick=()=>openLaptop();
  q('button[data-a="send"]').onclick=()=>{
    const to=q('#mTo').value.trim(), sub=q('#mSub').value.trim(), body=q('#mBody').value.trim();
    if(!to&&!sub&&!body){ return; }
    gameData.emails.push({to,subject:sub,body,date:Date.now()});
    saveGame();
    showOverlay(`<h3>✉️ Enviado</h3><p style="font-size:14px">Tu correo se ha guardado en Enviados.</p>
      <div class="btnrow"><button class="ui primary" data-a="ok">Aceptar</button></div>`,'laptop');
    overlay.querySelector('button[data-a="ok"]').onclick=()=>openLaptop();
  };
}
function sentBox(){
  let list='';
  if(gameData.emails.length===0) list='<p style="font-size:14px;color:#8a90a8">No has enviado ningún correo todavía.</p>';
  else gameData.emails.slice().reverse().forEach(m=>{
    list+=`<div class="listitem"><div class="meta">${fmtDate(m.date)} · Para: ${esc(m.to||'(sin destinatario)')}</div>
      <b>${esc(m.subject||'(sin asunto)')}</b><br>${esc(m.body||'')}</div>`;
  });
  showOverlay(`<button class="close">✕</button><h3>📤 Enviados</h3>${list}
    <div class="btnrow"><button class="ui" data-a="back">← Volver</button></div>`,'laptop');
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelector('button[data-a]').onclick=()=>openLaptop();
}
function docList(){
  let list='';
  if(gameData.documents.length===0) list='<p style="font-size:14px;color:#8a90a8">No hay documentos guardados.</p>';
  else gameData.documents.slice().reverse().forEach((d,i)=>{
    const realIdx=gameData.documents.length-1-i;
    list+=`<div class="listitem" data-doc="${realIdx}" style="cursor:pointer"><div class="meta">${fmtDate(d.date)}</div><b>${esc(d.title||'(sin título)')}</b></div>`;
  });
  showOverlay(`<button class="close">✕</button><h3>📝 Documentos</h3>${list}
    <div class="btnrow"><button class="ui primary" data-a="new">＋ Nuevo documento</button>
    <button class="ui" data-a="back">← Volver</button></div>`,'laptop');
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelector('button[data-a="new"]').onclick=()=>docEdit(null);
  overlay.querySelector('button[data-a="back"]').onclick=()=>openLaptop();
  overlay.querySelectorAll('[data-doc]').forEach(el=>el.onclick=()=>docEdit(parseInt(el.dataset.doc)));
}
function docEdit(idx){
  const doc = idx!=null ? gameData.documents[idx] : {title:'',body:''};
  showOverlay(`<button class="close">✕</button><h3>📝 Documento</h3>
    <input class="ui" id="dTitle" placeholder="Título" value="${esc(doc.title)}">
    <textarea class="ui" id="dBody" placeholder="Escribe aquí tu documento...">${esc(doc.body)}</textarea>
    <div class="btnrow"><button class="ui primary" data-a="save">💾 Guardar</button>
    <button class="ui" data-a="back">← Volver</button></div>`,'laptop');
  overlay.querySelector('.close').onclick=closeOverlay;
  const q=s=>overlay.querySelector(s);
  q('button[data-a="back"]').onclick=()=>docList();
  q('button[data-a="save"]').onclick=()=>{
    const title=q('#dTitle').value.trim(), body=q('#dBody').value;
    if(idx!=null){ gameData.documents[idx]={title,body,date:Date.now()}; }
    else { gameData.documents.push({title,body,date:Date.now()}); }
    saveGame();
    docList();
  };
}

// --- CUADERNO ---
function openNotebook(){
  let pages='';
  if(gameData.notebook.length===0) pages='<p style="font-size:14px;color:#8a90a8">El cuaderno está en blanco.</p>';
  else gameData.notebook.slice().reverse().forEach((p,i)=>{
    const realIdx=gameData.notebook.length-1-i;
    pages+=`<div class="listitem" data-page="${realIdx}" style="cursor:pointer"><div class="meta">${fmtDate(p.date)}</div>${esc(p.text).slice(0,60)}${p.text.length>60?'…':''}</div>`;
  });
  showOverlay(`<button class="close">✕</button><h3>📓 Cuaderno de notas</h3>${pages}
    <div class="btnrow"><button class="ui primary" data-a="new">＋ Nueva nota</button>
    <button class="ui" data-a="back">← Volver</button></div>`);
  overlay.querySelector('.close').onclick=closeOverlay;
  overlay.querySelector('button[data-a="new"]').onclick=()=>notePage(null);
  overlay.querySelector('button[data-a="back"]').onclick=()=>openInventory();
  overlay.querySelectorAll('[data-page]').forEach(el=>el.onclick=()=>notePage(parseInt(el.dataset.page)));
}
function notePage(idx){
  const pg = idx!=null ? gameData.notebook[idx] : {text:''};
  showOverlay(`<button class="close">✕</button><h3>📓 Nota</h3>
    <textarea class="ui" id="nText" placeholder="Escribe tu nota...">${esc(pg.text)}</textarea>
    <div class="btnrow"><button class="ui primary" data-a="save">💾 Guardar</button>
    <button class="ui" data-a="back">← Volver</button></div>`);
  overlay.querySelector('.close').onclick=closeOverlay;
  const q=s=>overlay.querySelector(s);
  q('button[data-a="back"]').onclick=()=>openNotebook();
  q('button[data-a="save"]').onclick=()=>{
    const text=q('#nText').value;
    if(idx!=null) gameData.notebook[idx]={text,date:Date.now()};
    else gameData.notebook.push({text,date:Date.now()});
    saveGame();
    openNotebook();
  };
}

    <p style="font-size:14px">Hay algo aquí.</p>

//==================================================================
//  INTEGRACIÓN DE OBJETOS CON EL MUNDO
//==================================================================
function worldItemAt(x,y){
  for(const id in ITEMS){
    const st=gameData.worldItems[id];
    if(st==='taken'||st==='dropped') continue;
    const sp=ITEMS[id].spawn;
    if(sp.scene===scene && sp.x===x && sp.y===y) return id;
  }
  const d=gameData.droppedItems.find(d=>d.scene===scene && d.x===x && d.y===y);
  if(d) return d.id;
  return null;
}
function worldItemsInScene(){
  const out=[];
  for(const id in ITEMS){
    const st=gameData.worldItems[id];
    if(st==='taken'||st==='dropped') continue;
    const sp=ITEMS[id].spawn;
    if(sp.scene===scene) out.push({id,x:sp.x,y:sp.y});
  }
  gameData.droppedItems.forEach(d=>{ if(d.scene===scene) out.push({id:d.id,x:d.x,y:d.y}); });
  return out;
}
function drawWorldItemAt(ctx,x,y,id){
  const sx=x*TILE-cam.x, sy=y*TILE-cam.y;
  ctx.save(); ctx.translate(sx,sy);
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fillRect(3,TILE-3,TILE-6,2);
  drawItemIcon(ctx, ITEMS[id].type);
  ctx.restore();
}


//==================================================================
//  MENÚ DE INICIO: CONTINUAR / NUEVA PARTIDA + GUARDADO AUTO
//==================================================================
// Aplica el estado cargado (gameData) al juego y entra a jugar
function applyLoadedGame(){
  // personaje y carrera
  const ch = CHARS.find(c=>c.id===gameData.char) || CHARS[0];
  player.char = ch;
  player.career = gameData.career;
  document.getElementById('menu').style.display='none';
  document.getElementById('hud').style.display='flex';
  enterPlayUI();
  invBtn.style.display='flex';
  // posición guardada
  const pos = gameData.pos || {scene:'outdoor', x:39, y:31};
  if(pos.scene==='outdoor'){
    loadScene('outdoor',[pos.x,pos.y],player.dir||'up');
  } else if(INTERIORS[pos.scene]){
    // reconstruir pila mínima para poder salir
    sceneStack=[{scene:'outdoor', x:39, y:31}];
    loadScene(pos.scene,[pos.x,pos.y],player.dir||'down');
  } else {
    loadScene('outdoor',[39,31],'up');
  }
  state='play';
  showToast('Partida cargada');
}
function continueGame(){
  const raw=loadSaveRaw();
  if(!raw){ return; }
  try{
    const data=JSON.parse(raw);
    // fusionar con estructura por defecto (por si faltan campos)
    gameData = Object.assign({inventory:[],worldItems:{},droppedItems:[],emails:[],documents:[],notebook:[]}, data);
  }catch(e){ return; }
  applyLoadedGame();
}
function newGame(){
  deleteSave();
  gameData = {inventory:[],worldItems:{},droppedItems:[],emails:[],documents:[],notebook:[],
              savedAt:null,char:null,career:null,pos:null};
}

// Insertar botón "Continuar" en el menú si hay guardado
(function setupMenu(){
  const menu=document.getElementById('menu');
  const cont=document.createElement('button');
  cont.id='continueBtn'; cont.textContent='▶ CONTINUAR PARTIDA';
  cont.style.cssText='margin-bottom:10px;display:none;';
  // insertar antes del startBtn
  startBtn.parentNode.insertBefore(cont, startBtn);
  if(hasSave()){
    cont.style.display='';
    // no autohabilitar start; continuar es independiente de elegir personaje
  }
  cont.onclick=()=>continueGame();
})();


//==================================================================
//  BUCLE
//==================================================================
function loop(){
  animTick++;
  syncUIState();
  if(state==='play'){ tryMove(); updateMove(); if(animTick%6===0)updateLocation(); }
  updateCamera(); render();
  requestAnimationFrame(loop);
}
updateLocation();
requestAnimationFrame(loop);
